version: '3.8'

services:
  # ======================================================================
  # RAG-SearX API服务
  # ======================================================================
  rag-searx-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-searx-api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - VECTOR_DB_HOST=milvus-standalone
      - REDIS_HOST=redis
      - DATABASE_URL=sqlite:///./data/rag_searx.db
    env_file:
      - .env
    depends_on:
      - milvus-standalone
      - redis
      - etcd
      - minio
    restart: unless-stopped
    networks:
      - rag-searx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ======================================================================
  # Milvus向量数据库 - 单机版
  # ======================================================================
  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.4
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    networks:
      - rag-searx-network

  # ======================================================================
  # Etcd - Milvus元数据存储
  # ======================================================================
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag-searx-network

  # ======================================================================
  # MinIO - Milvus对象存储
  # ======================================================================
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag-searx-network

  # ======================================================================
  # Redis缓存
  # ======================================================================
  redis:
    container_name: rag-searx-redis
    image: redis:7.2-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-searx-network

  # ======================================================================
  # Attu - Milvus管理界面 (可选)
  # ======================================================================
  attu:
    container_name: attu
    image: zilliz/attu:v2.3.2
    environment:
      MILVUS_URL: milvus-standalone:19530
    ports:
      - "8080:3000"
    depends_on:
      - "milvus-standalone"
    networks:
      - rag-searx-network

  # ======================================================================
  # Prometheus监控 (可选)
  # ======================================================================
  prometheus:
    container_name: rag-searx-prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - rag-searx-network
    profiles:
      - monitoring

  # ======================================================================
  # Grafana监控面板 (可选)
  # ======================================================================
  grafana:
    container_name: rag-searx-grafana
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - rag-searx-network
    profiles:
      - monitoring

  # ======================================================================
  # Nginx反向代理 (可选)
  # ======================================================================
  nginx:
    container_name: rag-searx-nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/nginx/logs:/var/log/nginx
    depends_on:
      - rag-searx-api
    networks:
      - rag-searx-network
    profiles:
      - production

# ======================================================================
# 网络配置
# ======================================================================
networks:
  rag-searx-network:
    driver: bridge

# ======================================================================
# 卷配置
# ======================================================================
volumes:
  milvus_data:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local 